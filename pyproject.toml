[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jane"
version = "0.1.0"
description = "Jane — English Vocabulary Builder CLI for Anki + HyperTTS"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
jane = "jane.cli:main"

[tool.setuptools.packages.find]
include = ["jane*"]
